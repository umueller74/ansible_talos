---
# tasks file for roles/talos_bootstrap
- name: Bootstrap Talos cluster
  ansible.builtin.command:
    cmd: >-
      talosctl bootstrap
      --talosconfig {{ talos_output_dir }}/talosconfig
      --endpoints {{ inventory_hostname }}
      --nodes {{ inventory_hostname }}
  register: talos_bootstrap_result
  changed_when: talos_bootstrap_result.rc == 0
  failed_when:
    - talos_bootstrap_result.rc != 0
    - "'AlreadyExists' not in talos_bootstrap_result.stderr"
