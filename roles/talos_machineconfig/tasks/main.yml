---
# tasks file for roles/talos_machineconfig
# Runs once per Talos node, locally on the controller.
- name: Generate Talos cluster config in {{ talos_output_dir }}
  ansible.builtin.command:
    cmd: >-
      talosctl gen config
      {{ talos_cluster_name }}
      {{ talos_cluster_endpoint }}
      --kubernetes-version {{ kubernetes_version | regex_replace('^v', '') }}
      --output-dir {{ talos_output_dir }}
    creates: "{{ talos_output_dir }}/controlplane.yaml"
  run_once: true

- name: Ensure patch and node directories exist
  ansible.builtin.file:
    path: "{{ talos_output_dir }}/{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - patches
    - nodes
  run_once: true

- name: Write node patch
  ansible.builtin.template:
    src: node-patch.yaml.j2
    dest: "{{ talos_output_dir }}/patches/{{ inventory_hostname }}.yaml"
    mode: "0600"

- name: Build node config from base config and patch
  ansible.builtin.command:
    cmd: >-
      talosctl machineconfig patch
      {{ talos_output_dir }}/{{ talos_machineconfig_base }}.yaml
      --patch @{{ talos_output_dir }}/patches/{{ inventory_hostname }}.yaml
      --output {{ talos_output_dir }}/nodes/{{ inventory_hostname }}.yaml
  vars:
    talos_machineconfig_base: "{{ 'controlplane' if inventory_hostname in groups['talos_controlplane'] else 'worker' }}"
  changed_when: true

- name: Validate node config
  ansible.builtin.command:
    cmd: >-
      talosctl validate
      --config {{ talos_output_dir }}/nodes/{{ inventory_hostname }}.yaml
      --mode {{ talos_machineconfig_validate_mode }}
  changed_when: false
