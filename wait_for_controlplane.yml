---
- name: Wait for controlplane node to come back
  hosts: talos_controlplane[0]
  connection: local
  gather_facts: false

  tasks:
    - name: Wait until the Talos API answers with the cluster talosconfig
      ansible.builtin.command:
        cmd: >-
          talosctl version
          --talosconfig {{ talos_output_dir }}/talosconfig
          --endpoints {{ inventory_hostname }}
          --nodes {{ inventory_hostname }}
      register: talos_wait
      until: talos_wait.rc == 0
      retries: 60
      delay: 10
      changed_when: false
