---
talos_cluster_name: homelab
talos_version: v1.13.0
kubernetes_version: v1.36.0

talos_cluster_endpoint: "https://{{ groups['talos_controlplane'][0] }}:6443"
talos_api_endpoint: "{{ groups['talos_controlplane'][0] }}"
talos_controlplane_vip: "{{ groups['talos_controlplane'][0] }}"

talos_output_dir: "{{ playbook_dir }}/{{ talos_cluster_name }}"

dns: 
  - 192.168.0.1
domain: muellernetz.de
ntp_servers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org
  - 2.pool.ntp.org
